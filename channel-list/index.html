<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel List | OrbitTV</title><meta name="description" content="Browse the OrbitTV channel directory by country, category or channel name. Contact OrbitTV on Telegram or WhatsApp.">
<link rel="icon" href="../assets/orbit-logo.png"><link rel="stylesheet" href="./channel-list.css?v=20260912c"><script src="./channel-list.js?v=20260912c" defer></script>
</head>
<body>
<header><a class="brand" href="/" aria-label="OrbitTV home"><img src="../assets/orbit-logo.png" alt="OrbitTV logo"><strong>OrbitTV</strong></a><button id="menu" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navigation">☰</button><nav id="navigation" aria-label="Main navigation"><a href="/">Home</a><a href="./" aria-current="page">Channel List</a><a href="../Installation-Guide">Installation</a></nav></header>
<main>
<h1>OrbitTV<br>Channel List</h1>
<section id="channel-browser" class="directory" aria-label="Channel directory">
<section><h2>Categories</h2><form id="category-form"><label class="sr-only" for="category-search">Category or country</label><input id="category-search" placeholder="Search categories or countries…" type="search"><button type="submit">Search</button></form><div id="categories" class="results" aria-live="polite"></div></section>
<section><h2>Channels</h2><form id="channel-form"><label class="sr-only" for="channel-search">Channel name</label><input id="channel-search" placeholder="Search channels…" type="search" disabled><button id="channel-submit" type="submit" disabled>Search</button></form><div id="channels" class="results" aria-live="polite"><p class="hint">Choose a category to see its channels.</p></div></section>
</section>
</main>
</body>
</html>
